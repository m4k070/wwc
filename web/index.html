<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WireLevel GPU Simulator</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px 0; color: #00d4ff; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .controls label { font-size: 13px; }
  .controls input[type=number] { width: 70px; background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; padding: 4px; }
  .controls button { background: #0f3460; color: #e0e0e0; border: 1px solid #00d4ff; padding: 4px 12px; cursor: pointer; }
  .controls button:hover { background: #00d4ff; color: #1a1a2e; }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 12px; margin-bottom: 8px; color: #888; }
  canvas { border: 1px solid #0f3460; image-rendering: pixelated; max-width: 100%; max-height: 80vh; }
  #log { font-size: 11px; margin-top: 8px; max-height: 200px; overflow-y: auto; background: #16213e; padding: 8px; }
  #log div { padding: 1px 0; }
  .err { color: #ff6b6b; }
  .ok  { color: #51cf66; }
  .info { color: #74c0fc; }
</style>
</head>
<body>
<h1>WireLevel GPU Simulator</h1>
<div class="controls">
  <label>世代:</label>
  <input type="number" id="genCount" value="100" min="1" max="100000">
  <button id="btnStep">▶ 1 世代</button>
  <button id="btnRun">▶▶ N 世代</button>
  <button id="btnReset">⟳ 初期化</button>
  <label>倍率:</label>
  <input type="number" id="scale" value="4" min="1" max="32">
  <label>grid.bin:</label>
  <input type="file" id="fileInput" accept=".bin">
  <button id="btnExport">⬇ result.bin</button>
</div>
<div class="status" id="status">初期化中...</div>
<canvas id="canvas"></canvas>
<div id="log"></div>

<script type="module">
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function logMsg(msg, cls = 'info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

// Color palette for 6 cell kinds
const COLORS = [
  '#1a1a2e', // 0 Empty
  '#ffd43b', // 1 Pin (yellow)
  '#00d4ff', // 2 Wire (cyan)
  '#ff6b6b', // 3 Nand (red)
  '#51cf66', // 4 Cross (green)
  '#cc5de8', // 5 Dff (purple)
];
// Level-on variants (brighter)
const COLORS_ON = [
  '#1a1a2e',
  '#fff9c4',
  '#80efff',
  '#ff9999',
  '#8ce99a',
  '#e599f7',
];

// WGSL shader source — embedded inline to support file:// access (fetch is CORS-blocked)
const shaderCode = `// WireLevel WGSL compute shader
// Cell encoding (matches WireLevel.encodeCell):
//   bit 7-5: kind (0=Empty 1=Pin 2=Wire 3=Nand 4=Cross 5=Dff)
//   bit 4-3: dir (E=0 W=1 N=2 S=3)
//     Cross: bit4=hDir(E=0,W=1), bit3=vDir(N=0,S=1)
//   bit 1-0: levels
//     Wire/Nand/Pin: bit0=level
//     Cross: bit1=vv, bit0=hv
//     Dff:   bit1=prevClk, bit0=q

// Directions
const E: u32 = 0u;
const W: u32 = 1u;
const N: u32 = 2u;
const S: u32 = 3u;

// Kind constants
const K_EMPTY: u32 = 0u;
const K_PIN:   u32 = 1u;
const K_WIRE:  u32 = 2u;
const K_NAND:  u32 = 3u;
const K_CROSS: u32 = 4u;
const K_DFF:   u32 = 5u;

struct Params {
    width: u32,
    height: u32,
    flags: u32,
}

@group(0) @binding(0) var<storage, read>     src  : array<u32>;
@group(0) @binding(1) var<storage, read_write> dst  : array<u32>;
@group(0) @binding(2) var<uniform>           dims : Params;

fn cellAtStorage(src: ptr<storage, array<u32>>, i: u32) -> u32 {
    return (*src)[i];
}

fn setCell(dst: ptr<storage, array<u32>, read_write>, i: u32, val: u32) {
    (*dst)[i] = val;
}

fn kind(c: u32) -> u32 { return (c >> 5u) & 7u; }
fn dir(c: u32) -> u32 { return (c >> 3u) & 3u; }
fn level(c: u32) -> u32 { return c & 1u; }

fn opposite(d: u32) -> u32 {
    switch (d) {
        case E: { return W; }
        case W: { return E; }
        case N: { return S; }
        default: { return N; }
    }
}

fn delta(d: u32) -> vec2<i32> {
    switch (d) {
        case E: { return vec2( 1,  0); }
        case W: { return vec2(-1,  0); }
        case N: { return vec2( 0, -1); }
        default: { return vec2( 0,  1); }
    }
}

fn presentedTo(c: u32, toward: u32) -> u32 {
    let k = kind(c);
    if (k == K_EMPTY) { return 0xFFFFFFFFu; }
    if (k == K_PIN || k == K_WIRE || k == K_NAND) { return level(c); }
    if (k == K_DFF) { return c & 1u; }
    if (k == K_CROSS) {
        let hDir = select(E, W, ((c >> 4u) & 1u) == 1u);
        let vDir = select(N, S, ((c >> 3u) & 1u) == 1u);
        let hLevel = c & 1u;
        let vLevel = (c >> 1u) & 1u;
        if (toward == hDir) { return hLevel; }
        if (toward == vDir) { return vLevel; }
        return 0xFFFFFFFFu;
    }
    return 0xFFFFFFFFu;
}

fn pullFrom(src: ptr<storage, array<u32>>, x: i32, y: i32, side: u32) -> u32 {
    let d = delta(side);
    let nx = x + d.x;
    let ny = y + d.y;
    if (nx < 0 || ny < 0 || nx >= i32(dims.width) || ny >= i32(dims.height)) { return 0xFFFFFFFFu; }
    let ni = u32(ny) * dims.width + u32(nx);
    let nb = cellAtStorage(src, ni);
    return presentedTo(nb, opposite(side));
}

fn stepCell(src: ptr<storage, array<u32>>, x: i32, y: i32) -> u32 {
    let i = u32(y) * dims.width + u32(x);
    let cell = cellAtStorage(src, i);
    let k = kind(cell);
    if (k == K_EMPTY || k == K_PIN) { return cell; }
    if (k == K_WIRE) {
        let d = dir(cell);
        let v = pullFrom(src, x, y, opposite(d));
        return (cell & 0xF8u) | select(0u, 1u, v == 1u);
    }
    if (k == K_NAND) {
        let d = dir(cell);
        var allTrue: bool = true;
        var anyInput: bool = false;
        for (var s: u32 = 0u; s < 4u; s = s + 1u) {
            if (s != d) {
                let v = pullFrom(src, x, y, s);
                if (v != 0xFFFFFFFFu) { anyInput = true; if (v == 0u) { allTrue = false; } }
            }
        }
        return (cell & 0xF8u) | select(0u, 1u, anyInput && !allTrue);
    }
    if (k == K_CROSS) {
        let hd = select(E, W, ((cell >> 4u) & 1u) == 1u);
        let vd = select(N, S, ((cell >> 3u) & 1u) == 1u);
        let hv = pullFrom(src, x, y, opposite(hd));
        let vv = pullFrom(src, x, y, opposite(vd));
        return (cell & 0xF8u) | (select(0u, 1u, vv == 1u) << 1u) | select(0u, 1u, hv == 1u);
    }
    if (k == K_DFF) {
        let d = dir(cell);
        let dVal = select(0u, 1u, pullFrom(src, x, y, opposite(d)) == 1u);
        var clk: bool = false;
        for (var s: u32 = 0u; s < 4u; s = s + 1u) {
            let isPerp = ((d == E || d == W) && (s == N || s == S)) || ((d == N || d == S) && (s == E || s == W));
            if (isPerp) { if (pullFrom(src, x, y, s) == 1u) { clk = true; } }
        }
        let prevClk = (cell >> 1u) & 1u;
        let q = select(cell & 1u, dVal, clk && prevClk == 0u);
        return (cell & 0xF8u) | (select(0u, 1u, clk) << 1u) | q;
    }
    return cell;
}

@compute @workgroup_size(16, 16)
fn step(@builtin(global_invocation_id) gid: vec3u) {
    let x = i32(gid.x);
    let y = i32(gid.y);
    if (x >= i32(dims.width) || y >= i32(dims.height)) { return; }
    let i = u32(y) * dims.width + u32(x);
    let newCell = stepCell(&src, x, y);
    setCell(&dst, i, newCell);
}`;

// ---- WebGPU init ----
let device, queue, pipeline, bindGroup, srcBuf, dstBuf, paramsBuf;
let width = 0, height = 0;
let cells = null; // Uint8Array
let gen = 0;
let ping = true;
let running = false;

async function initWebGPU() {
  const adapter = await navigator.gpu?.requestAdapter();
  if (!adapter) throw new Error('WebGPU not supported');
  device = await adapter.requestDevice();
  queue = device.queue;

  // Capture GPU errors for debugging
  let gpuErrors = [];
  device.addEventListener('uncapturederror', (e) => {
    gpuErrors.push(e.error.message);
    logMsg('GPU error: ' + e.error.message, 'err');
  });
  const shader = device.createShaderModule({ code: shaderCode });

  // WGSL compilation doesn't throw — check explicitly
  const compInfo = await shader.getCompilationInfo();
  const errors = compInfo.messages.filter(m => m.type === 'error');
  if (errors.length > 0) {
    throw new Error('WGSL errors:\n' + errors.map(e => e.message + ' (line ' + e.lineNum + ')').join('\n'));
  }

  pipeline = await device.createComputePipelineAsync({
    layout: 'auto',
    compute: { module: shader, entryPoint: 'step' },
  });

  logMsg('WebGPU ready: ' + adapter.name, 'ok');
}

// ---- Buffer management ----
function ensureBuffers(w, h) {
  const oldW = width, oldH = height;
  width = w; height = h;

  const cellCount = w * h;
  const u32Count = w * h;
  const bufSize = u32Count * 4;

  if (oldW !== w || oldH !== h || !srcBuf || srcBuf.size !== bufSize) {
    srcBuf?.destroy();
    dstBuf?.destroy();
    paramsBuf?.destroy();

    srcBuf = device.createBuffer({
      size: bufSize,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
    });
    dstBuf = device.createBuffer({
      size: bufSize,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
    });
    paramsBuf = device.createBuffer({
      size: 12, // 3 x u32
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: srcBuf } },
        { binding: 1, resource: { buffer: dstBuf } },
        { binding: 2, resource: { buffer: paramsBuf } },
      ],
    });

    // Initially source buffer gets the grid data
    updateParams();
  }
}

function updateParams() {
  queue.writeBuffer(paramsBuf, 0, new Uint32Array([width, height, 0]));
}

function packCells(w, h, cellData) {
  const packed = new Uint32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    packed[i] = cellData[i];
  }
  return packed;
}

function unpackCells(w, h, packed) {
  const cells = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    cells[i] = packed[i] & 0xFF;
  }
  return cells;
}

function uploadGrid(w, h, cellData) {
  ensureBuffers(w, h);
  const packed = packCells(w, h, cellData);
  queue.writeBuffer(srcBuf, 0, packed);
  queue.writeBuffer(dstBuf, 0, packed);
  ping = true;
  gen = 0;
  cells = new Uint8Array(cellData);
  render();
  statusEl.textContent = `${w}×${h}, ${cellData.filter(b => b !== 0).length} cells, gen=${gen}`;
}

function downloadResult() {
  const u32Count = width * height;
  const buf = ping ? srcBuf : dstBuf;

  const readBuf = device.createBuffer({
    size: u32Count * 4,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });
  const encoder = device.createCommandEncoder();
  encoder.copyBufferToBuffer(buf, 0, readBuf, 0, u32Count * 4);
  device.queue.submit([encoder.finish()]);

  return readBuf.mapAsync(GPUMapMode.READ).then(() => {
    const packed = new Uint32Array(readBuf.getMappedRange());
    const out = unpackCells(width, height, packed);
    readBuf.unmap();
    readBuf.destroy();
    return out;
  });
}

// ---- Simulation ----
async function stepGPU() {
  if (!srcBuf) return;

  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);

  // Swap buffers: src = ping ? srcBuf : dstBuf, dst = ping ? dstBuf : srcBuf
  const src = ping ? srcBuf : dstBuf;
  const dst = ping ? dstBuf : srcBuf;
  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: src } },
      { binding: 1, resource: { buffer: dst } },
      { binding: 2, resource: { buffer: paramsBuf } },
    ],
  });
  pass.setBindGroup(0, bindGroup);

  const gx = Math.ceil(width / 16);
  const gy = Math.ceil(height / 16);
  pass.dispatchWorkgroups(gx, gy);
  pass.end();
  device.queue.submit([encoder.finish()]);
  await device.queue.onSubmittedWorkDone();

  ping = !ping;
  gen++;
}

async function runN(n) {
  running = true;
  for (let i = 0; i < n; i++) {
    if (!running) break;
    await stepGPU();
    if (i % 100 === 0 || i === n - 1) {
      statusEl.textContent = `${width}×${height}, gen=${gen}`;
      await readAndRender();
    }
  }
  running = false;
}

async function stepN(n) {
  for (let i = 0; i < n; i++) {
    await stepGPU();
  }
}

async function readAndRender() {
  const buf = ping ? srcBuf : dstBuf;
  const u32Count = width * height;

  const readBuf = device.createBuffer({
    size: u32Count * 4,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });
  const encoder = device.createCommandEncoder();
  encoder.copyBufferToBuffer(buf, 0, readBuf, 0, u32Count * 4);
  device.queue.submit([encoder.finish()]);

  await readBuf.mapAsync(GPUMapMode.READ);
  const packed = new Uint32Array(readBuf.getMappedRange());
  cells = unpackCells(width, height, packed);
  readBuf.unmap();
  readBuf.destroy();
  render();
}

function render() {
  if (!cells) return;
  const scale = parseInt(document.getElementById('scale').value) || 4;
  canvas.width = width * scale;
  canvas.height = height * scale;

  const imgData = ctx.createImageData(width, height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const b = cells[y * width + x];
      const k = (b >> 5) & 7;
      const lvl = b & 1;
      const palette = lvl ? COLORS_ON : COLORS;
      const hex = palette[k] || '#000';
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const bl = parseInt(hex.slice(5,7), 16);
      const i = (y * width + x) * 4;
      imgData.data[i] = r;
      imgData.data[i+1] = g;
      imgData.data[i+2] = bl;
      imgData.data[i+3] = 255;
    }
  }

  // Scale up using a temp canvas
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = width;
  tmpCanvas.height = height;
  const tmpCtx = tmpCanvas.getContext('2d');
  tmpCtx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmpCanvas, 0, 0, width * scale, height * scale);
}

// ---- File I/O ----
function loadGridBin(data) {
  const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
  if (data.byteLength < 8) throw new Error('File too small');
  const w = view.getUint32(0, true);
  const h = view.getUint32(4, true);
  const expected = 8 + w * h;
  if (data.byteLength !== expected) {
    throw new Error(`Size mismatch: expected ${expected}, got ${data.byteLength}`);
  }
  const cellData = new Uint8Array(data.buffer, data.byteOffset + 8, w * h);
  logMsg(`Loaded ${w}×${h} grid (${cellData.filter(b => b !== 0).length} cells)`, 'ok');
  uploadGrid(w, h, cellData);
}

function exportResultBin() {
  if (!cells) return;
  downloadResult().then(cellData => {
    const header = new Uint32Array([width, height]);
    const buf = new Uint8Array(8 + cellData.length);
    new DataView(buf.buffer).setUint32(0, width, true);
    new DataView(buf.buffer).setUint32(4, height, true);
    buf.set(cellData, 8);

    const blob = new Blob([buf], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `result_${gen}gen.bin`;
    a.click();
    URL.revokeObjectURL(url);
    logMsg(`Exported result.bin (gen=${gen})`, 'ok');
  });
}

// ---- Demo: toggle FF circuit ----
function buildToggleFF() {
  // Simple toggle FF manually assembled
  // DFF(output E) + NOT(output W) feedback loop, clk pin at (0,0)
  // Grid: 12 × 9
  const w = 12, h = 9;
  const data = new Uint8Array(w * h);

  // Helper: set cell at (x,y)
  const set = (x, y, val) => { data[y * w + x] = val; };

  // Pin (clk) at (0,0) = 001_00_000 | 0 = 0x20
  set(0, 0, 0x20); // Pin(0)

  // Wires: clk -> DFF side
  // (0,0) -> (1,0) Wire(E)
  set(1, 0, 0b010_00_000); // Wire(E)

  // DFF at (2,4), output E, clk from S side
  // Wire from (1,0) down to (2,3)-(2,4) region
  // Actually let me just build a minimal toggleFF using ofAsciiL format translated

  // For the demo, let's use a prebuilt toggle FF
  // Too complex for manual byte construction; use file upload instead
  logMsg('Built-in demo TBD — use file upload with a compiled grid.bin', 'err');
}

// ---- Event handlers ----
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadGridBin(new Uint8Array(reader.result));
  reader.readAsArrayBuffer(file);
});

document.getElementById('btnStep').addEventListener('click', async () => {
  if (running) return;
  await stepGPU();
  statusEl.textContent = `${width}×${height}, gen=${gen}`;
  await readAndRender();
});

document.getElementById('btnRun').addEventListener('click', async () => {
  if (running) return;
  const n = parseInt(document.getElementById('genCount').value) || 100;
  document.getElementById('btnRun').disabled = true;
  await runN(n);
  document.getElementById('btnRun').disabled = false;
  statusEl.textContent = `${width}×${height}, gen=${gen}`;
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (running) return;
  if (cells) uploadGrid(width, height, cells);
});

document.getElementById('btnExport').addEventListener('click', exportResultBin);

document.getElementById('scale').addEventListener('change', render);

// ---- Init ----
try {
  await initWebGPU();
  statusEl.textContent = 'grid.bin を開くか、ドラッグ&ドロップ';
  logMsg('WebGPU 初期化完了', 'ok');
} catch (e) {
  statusEl.textContent = 'Error: ' + e.message;
  logMsg(e.message, 'err');
}

// Expose for headless test automation (puppeteer/playwright)
window._wwcReady = true;
window.stepGPU = stepGPU;
window.stepN = stepN;
window.runN = runN;
window.downloadResult = downloadResult;
window.exportResultBin = exportResultBin;
window.loadGridBin = loadGridBin;
window.uploadGrid = uploadGrid;
window.ensureBuffers = ensureBuffers;
window.setCellLevel = (x, y, level) => {
  const idx = y * width + x;
  const arr = new Uint8Array(cells);
  arr[idx] = (arr[idx] & 0xFC) | (level & 3);
  uploadGrid(width, height, arr);
};
Object.defineProperty(window, 'cells', { get: () => cells });
Object.defineProperty(window, 'width', { get: () => width });
Object.defineProperty(window, 'height', { get: () => height });
Object.defineProperty(window, 'running', { get: () => running });
Object.defineProperty(window, 'gpuErrors', { get: () => gpuErrors });
</script>
</body>
</html>
