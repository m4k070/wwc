<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mincpu Demo — WireLevel GPU Simulation</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; margin: 0; padding: 16px; display: flex; gap: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px 0; color: #00d4ff; }
  .panel { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 12px; }
  #viz { flex: 1; }
  #controls { width: 320px; flex-shrink: 0; }
  canvas { border: 1px solid #0f3460; image-rendering: pixelated; width: 100%; }
  .status { font-size: 12px; margin: 8px 0; color: #888; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .btn-row button { background: #0f3460; color: #e0e0e0; border: 1px solid #00d4ff; padding: 6px 16px; cursor: pointer; font-size: 13px; }
  .btn-row button:hover { background: #00d4ff; color: #1a1a2e; }
  .btn-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row button.danger { border-color: #ff6b6b; }
  .btn-row button.danger:hover { background: #ff6b6b; color: #1a1a2e; }
  .output-display { background: #0a0a1e; border: 2px solid #00d4ff; border-radius: 6px; padding: 16px; text-align: center; margin: 12px 0; }
  .output-value { font-size: 48px; font-weight: bold; color: #51cf66; font-family: 'Courier New', monospace; letter-spacing: 4px; }
  .output-label { font-size: 11px; color: #888; margin-top: 4px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #0f3460; }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: #888; }
  .stat-value { color: #74c0fc; font-weight: bold; }
  #log { font-size: 11px; margin-top: 8px; max-height: 200px; overflow-y: auto; background: #0a0a1e; padding: 6px; border-radius: 4px; }
  #log div { padding: 1px 0; }
  .err { color: #ff6b6b; }
  .ok  { color: #51cf66; }
  .info { color: #74c0fc; }
  .file-area { border: 2px dashed #0f3460; border-radius: 6px; padding: 12px; text-align: center; margin: 8px 0; font-size: 12px; cursor: pointer; }
  .file-area:hover { border-color: #00d4ff; }
  .cpu-diagram { font-size: 10px; line-height: 1.4; padding: 8px; background: #0a0a1e; border-radius: 4px; white-space: pre; overflow-x: auto; }
</style>
</head>
<body>
<div id="viz" class="panel">
  <h1>mincpu — WireLevel GPU Simulation</h1>
  <canvas id="canvas"></canvas>
  <div class="status" id="status">WebGPU 初期化中...</div>
</div>
<div id="controls" class="panel">
  <div class="output-display">
    <div class="output-label">OUT (hex)</div>
    <div class="output-value" id="outHex">--</div>
    <div class="output-label" style="margin-top:8px;font-size:10px">binary</div>
    <div style="font-size:16px;color:#74c0fc;letter-spacing:2px" id="outBin">--------</div>
  </div>

  <div class="btn-row">
    <button id="btnLoad">⬇ Load mincpu</button>
    <button id="btnPlay">▶ Play</button>
    <button id="btnStep">⏭ Step 1</button>
    <button id="btnStepN">⏩ Step 100</button>
    <button id="btnReset">⟳ Reset</button>
  </div>

  <div class="stat-row"><span class="stat-label">Generation</span><span class="stat-value" id="statGen">0</span></div>
  <div class="stat-row"><span class="stat-label">Grid</span><span class="stat-value" id="statGrid">--</span></div>
  <div class="stat-row"><span class="stat-label">Cells</span><span class="stat-value" id="statCells">--</span></div>
  <div class="stat-row"><span class="stat-label">Gates</span><span class="stat-value" id="statGates">287</span></div>
  <div class="stat-row"><span class="stat-label">Speed</span><span class="stat-value" id="statSpeed">--</span></div>

  <input type="file" id="fileInput" accept=".bin" style="display:none">
  <div class="file-area" id="fileArea">ドロップ or クリックで .bin ファイルを開く</div>

  <div class="cpu-diagram" id="cpuDiagram"></div>

  <div id="log"></div>
</div>

<script type="module">
// ---- GPU & Simulation (same WGSL shader as index.html) ----
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function logMsg(msg, cls = 'info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

const COLORS = ['#1a1a2e','#ffd43b','#00d4ff','#ff6b6b','#51cf66','#cc5de8'];
const COLORS_ON = ['#1a1a2e','#fff9c4','#80efff','#ff9999','#8ce99a','#e599f7'];

const shaderCode = `
const E: u32 = 0u; const W: u32 = 1u; const N: u32 = 2u; const S: u32 = 3u;
const K_EMPTY: u32 = 0u; const K_PIN: u32 = 1u; const K_WIRE: u32 = 2u; const K_NAND: u32 = 3u; const K_CROSS: u32 = 4u; const K_DFF: u32 = 5u;
struct Params { width: u32, height: u32, flags: u32, }
@group(0) @binding(0) var<storage, read>     src  : array<u32>;
@group(0) @binding(1) var<storage, read_write> dst  : array<u32>;
@group(0) @binding(2) var<uniform>           dims : Params;
fn kind(c: u32) -> u32 { return (c >> 5u) & 7u; }
fn dir(c: u32) -> u32 { return (c >> 3u) & 3u; }
fn level(c: u32) -> u32 { return c & 1u; }
fn opposite(d: u32) -> u32 { switch (d) { case E: { return W; } case W: { return E; } case N: { return S; } default: { return N; } } }
fn delta(d: u32) -> vec2<i32> { switch (d) { case E: { return vec2( 1,  0); } case W: { return vec2(-1,  0); } case N: { return vec2( 0, -1); } default: { return vec2( 0,  1); } } }
fn cellAtStorage(s: ptr<storage, array<u32>>, i: u32) -> u32 { return (*s)[i]; }
fn setCell(d: ptr<storage, array<u32>, read_write>, i: u32, v: u32) { (*d)[i] = v; }
fn presentedTo(c: u32, toward: u32) -> u32 {
  let k = kind(c);
  if (k == K_EMPTY) { return 0xFFFFFFFFu; }
  if (k == K_PIN || k == K_WIRE || k == K_NAND) { return level(c); }
  if (k == K_DFF) { return c & 1u; }
  if (k == K_CROSS) {
    let hDir = select(E, W, ((c >> 4u) & 1u) == 1u);
    let vDir = select(N, S, ((c >> 3u) & 1u) == 1u);
    if (toward == hDir) { return c & 1u; }
    if (toward == vDir) { return (c >> 1u) & 1u; }
    return 0xFFFFFFFFu;
  }
  return 0xFFFFFFFFu;
}
fn pullFrom(s: ptr<storage, array<u32>>, x: i32, y: i32, side: u32) -> u32 {
  let d = delta(side);
  let nx = x + d.x; let ny = y + d.y;
  if (nx < 0 || ny < 0 || nx >= i32(dims.width) || ny >= i32(dims.height)) { return 0xFFFFFFFFu; }
  return presentedTo(cellAtStorage(s, u32(ny) * dims.width + u32(nx)), opposite(side));
}
fn stepCell(s: ptr<storage, array<u32>>, x: i32, y: i32) -> u32 {
  let i = u32(y) * dims.width + u32(x);
  let cell = cellAtStorage(s, i); let k = kind(cell);
  if (k == K_EMPTY || k == K_PIN) { return cell; }
  if (k == K_WIRE) { return (cell & 0xF8u) | select(0u, 1u, pullFrom(s, x, y, opposite(dir(cell))) == 1u); }
  if (k == K_NAND) {
    let d = dir(cell); var allTrue: bool = true; var anyInput: bool = false;
    for (var side: u32 = 0u; side < 4u; side = side + 1u) {
      if (side != d) { let v = pullFrom(s, x, y, side); if (v != 0xFFFFFFFFu) { anyInput = true; if (v == 0u) { allTrue = false; } } }
    }
    return (cell & 0xF8u) | select(0u, 1u, anyInput && !allTrue);
  }
  if (k == K_CROSS) {
    let hd = select(E, W, ((cell >> 4u) & 1u) == 1u); let vd = select(N, S, ((cell >> 3u) & 1u) == 1u);
    let hv = pullFrom(s, x, y, opposite(hd)); let vv = pullFrom(s, x, y, opposite(vd));
    return (cell & 0xF8u) | (select(0u, 1u, vv == 1u) << 1u) | select(0u, 1u, hv == 1u);
  }
  if (k == K_DFF) {
    let d = dir(cell); let dVal = select(0u, 1u, pullFrom(s, x, y, opposite(d)) == 1u);
    var clk: bool = false;
    for (var side: u32 = 0u; side < 4u; side = side + 1u) {
      if (((d == E || d == W) && (side == N || side == S)) || ((d == N || d == S) && (side == E || side == W))) { if (pullFrom(s, x, y, side) == 1u) { clk = true; } }
    }
    let prevClk = (cell >> 1u) & 1u;
    return (cell & 0xF8u) | (select(0u, 1u, clk) << 1u) | select(cell & 1u, dVal, clk && prevClk == 0u);
  }
  return cell;
}
@compute @workgroup_size(16, 16)
fn step(@builtin(global_invocation_id) gid: vec3u) {
  let x = i32(gid.x); let y = i32(gid.y);
  if (x >= i32(dims.width) || y >= i32(dims.height)) { return; }
  let i = u32(y) * dims.width + u32(x);
  let newCell = stepCell(&src, x, y);
  setCell(&dst, i, newCell);
}
`;
const shaderCodeFull = shaderCode;

// ---- WebGPU state ----
let device, queue, pipeline, bindGroup, srcBuf, dstBuf, paramsBuf;
let width = 0, height = 0;
let cells = null; // Uint8Array — initial grid snapshot for reset
let gen = 0;
let ping = true;
let running = false;
let playTimer = null;
let totalSteps = 0;
let stepTimeLog = [];

// Output port positions (from F# ExportMincpuMeta.fsx, normalized to grid origin)
const OUT_PORTS = [
  { bit: 0, x: 276, y: 244 }, { bit: 1, x: 300, y: 244 },
  { bit: 2, x: 324, y: 244 }, { bit: 3, x: 348, y: 244 },
  { bit: 4, x: 372, y: 244 }, { bit: 5, x: 396, y: 244 },
  { bit: 6, x: 12,  y: 260 }, { bit: 7, x: 36,  y: 260 },
];

function readOutputValue() {
  if (!cells) return -1;
  let v = 0;
  for (const p of OUT_PORTS) {
    const idx = p.y * width + p.x;
    const cell = idx < cells.length ? cells[idx] : 0;
    const q = cell & 1; // DFF bit 0 = Q
    if (q) v |= (1 << p.bit);
  }
  return v;
}

function updateOutputDisplay() {
  const v = readOutputValue();
  if (v < 0) { document.getElementById('outHex').textContent = '--'; document.getElementById('outBin').textContent = '--------'; return; }
  document.getElementById('outHex').textContent = '0x' + v.toString(16).toUpperCase().padStart(2, '0');
  document.getElementById('outBin').textContent = v.toString(2).padStart(8, '0').split('').reverse().join('');
}

// ---- WebGPU init ----
async function initWebGPU() {
  const adapter = await navigator.gpu?.requestAdapter();
  if (!adapter) throw new Error('WebGPU not supported');
  device = await adapter.requestDevice();
  queue = device.queue;
  const shader = device.createShaderModule({ code: shaderCodeFull });
  const compInfo = await shader.getCompilationInfo();
  const errors = compInfo.messages.filter(m => m.type === 'error');
  if (errors.length > 0) throw new Error('WGSL errors:\n' + errors.map(e => e.message).join('\n'));
  pipeline = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: shader, entryPoint: 'step' } });
  logMsg('WebGPU ready: ' + adapter.name, 'ok');
}

function ensureBuffers(w, h) {
  const oldW = width, oldH = height;
  width = w; height = h;
  const u32Count = w * h;
  const bufSize = u32Count * 4;
  if (oldW !== w || oldH !== h || !srcBuf || srcBuf.size !== bufSize) {
    srcBuf?.destroy(); dstBuf?.destroy(); paramsBuf?.destroy();
    srcBuf = device.createBuffer({ size: bufSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    dstBuf = device.createBuffer({ size: bufSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    paramsBuf = device.createBuffer({ size: 12, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: srcBuf } },
        { binding: 1, resource: { buffer: dstBuf } },
        { binding: 2, resource: { buffer: paramsBuf } },
      ],
    });
    queue.writeBuffer(paramsBuf, 0, new Uint32Array([width, height, 0]));
  }
}

function uploadGrid(w, h, cellData) {
  ensureBuffers(w, h);
  const packed = new Uint32Array(w * h);
  for (let i = 0; i < w * h; i++) packed[i] = cellData[i];
  queue.writeBuffer(srcBuf, 0, packed);
  queue.writeBuffer(dstBuf, 0, packed);
  ping = true;
  gen = 0;
  totalSteps = 0;
  cells = new Uint8Array(cellData);
  document.getElementById('statGrid').textContent = `${w}×${h}`;
  document.getElementById('statCells').textContent = cellData.filter(b => b !== 0).length;
  render();
  updateOutputDisplay();
  statusEl.textContent = `${w}×${h}, gen=${gen}`;
  document.getElementById('statGen').textContent = '0';
}

async function readBack() {
  const buf = ping ? srcBuf : dstBuf;
  const u32Count = width * height;
  const readBuf = device.createBuffer({ size: u32Count * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const encoder = device.createCommandEncoder();
  encoder.copyBufferToBuffer(buf, 0, readBuf, 0, u32Count * 4);
  device.queue.submit([encoder.finish()]);
  await readBuf.mapAsync(GPUMapMode.READ);
  const packed = new Uint32Array(readBuf.getMappedRange());
  cells = new Uint8Array(width * height);
  for (let i = 0; i < width * height; i++) cells[i] = packed[i] & 0xFF;
  readBuf.unmap();
  readBuf.destroy();
}

async function stepGPU() {
  if (!srcBuf) return;
  const t0 = performance.now();
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  const src = ping ? srcBuf : dstBuf;
  const dst = ping ? dstBuf : srcBuf;
  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: src } },
      { binding: 1, resource: { buffer: dst } },
      { binding: 2, resource: { buffer: paramsBuf } },
    ],
  });
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(width / 16), Math.ceil(height / 16));
  pass.end();
  device.queue.submit([encoder.finish()]);
  await device.queue.onSubmittedWorkDone();
  ping = !ping;
  gen++;
  totalSteps++;
  const elapsed = performance.now() - t0;
  stepTimeLog.push(elapsed);
  if (stepTimeLog.length > 100) stepTimeLog.shift();
  document.getElementById('statGen').textContent = gen;
  const avg = stepTimeLog.reduce((a, b) => a + b, 0) / stepTimeLog.length;
  const speed = avg > 0 ? Math.round(1000 / avg) : 0;
  document.getElementById('statSpeed').textContent = `${speed} gen/s`;
}

async function stepN(n, readEvery = 100) {
  running = true;
  const t0 = performance.now();
  for (let i = 0; i < n; i++) {
    if (!running) break;
    await stepGPU();
    if (i % readEvery === 0 || i === n - 1) {
      await readBack();
      updateOutputDisplay();
      statusEl.textContent = `${width}×${height}, gen=${gen}, out=0x${readOutputValue().toString(16).toUpperCase()}`;
      render();
    }
  }
  const elapsed = performance.now() - t0;
  running = false;
  if (n > 0) { statusEl.textContent += ` (${elapsed.toFixed(0)}ms for ${n} steps)`; }
  return elapsed;
}

function render() {
  if (!cells || !width || !height) return;
  const scale = 2;
  canvas.width = width * scale;
  canvas.height = height * scale;
  const imgData = ctx.createImageData(width, height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const b = cells[y * width + x];
      const k = (b >> 5) & 7;
      const lvl = b & 1;
      const palette = lvl ? COLORS_ON : COLORS;
      const hex = palette[k] || '#000';
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const bl = parseInt(hex.slice(5,7), 16);
      const i = (y * width + x) * 4;
      imgData.data[i] = r; imgData.data[i+1] = g; imgData.data[i+2] = bl; imgData.data[i+3] = 255;
    }
  }
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = width; tmpCanvas.height = height;
  const tmpCtx = tmpCanvas.getContext('2d');
  tmpCtx.putImageData(imgData, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmpCanvas, 0, 0, width * scale, height * scale);
}

function loadGridBin(data) {
  if (data.byteLength < 8) throw new Error('File too small');
  const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const w = view.getUint32(0, true);
  const h = view.getUint32(4, true);
  const expected = 8 + w * h;
  if (data.byteLength !== expected) throw new Error(`Size mismatch: expected ${expected}, got ${data.byteLength}`);
  const cellData = new Uint8Array(data.buffer, data.byteOffset + 8, w * h);
  logMsg(`Loaded ${w}×${h} grid (${cellData.filter(b => b !== 0).length} cells)`, 'ok');
  uploadGrid(w, h, cellData);
  document.getElementById('cpuDiagram').textContent =
    `┌───── SM83 CPU ─────┐  gen=${gen}
│  ALU  ──┬── acc[8] │  out=0x${'0'.repeat(2)}
│  PC=00  │  ir=00   │
│  ROM[16]├── state=0│
│  out[8] │  JMP LDI │
└────────────────────┘`;
}

// ---- Controls ----
async function loadMincpu() {
  try {
    // Try via HTTP fetch first (works when serving via python3 -m http.server)
    const resp = await fetch('mincpu_clk1_init.bin');
    if (resp.ok) {
      const buf = await resp.arrayBuffer();
      loadGridBin(new Uint8Array(buf));
      logMsg('Auto-loaded mincpu_clk1_init.bin', 'ok');
      return;
    }
  } catch (e) {}
  // Fallback: trigger file input
  document.getElementById('fileInput').click();
}

document.getElementById('btnLoad').addEventListener('click', loadMincpu);

document.getElementById('btnStep').addEventListener('click', async () => {
  if (running) return;
  await stepGPU();
  await readBack();
  updateOutputDisplay();
  statusEl.textContent = `${width}×${height}, gen=${gen}, out=0x${readOutputValue().toString(16).toUpperCase()}`;
  render();
});

document.getElementById('btnStepN').addEventListener('click', async () => {
  if (running || !width) return;
  document.getElementById('btnStepN').disabled = true;
  await stepN(100, 10);
  document.getElementById('btnStepN').disabled = false;
});

document.getElementById('btnPlay').addEventListener('click', () => {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    document.getElementById('btnPlay').textContent = '▶ Play';
    return;
  }
  if (!width) return;
  document.getElementById('btnPlay').textContent = '⏸ Pause';
  let n = 0;
  playTimer = setInterval(async () => {
    if (running) return;
    await stepN(50, 10);
    n += 50;
    if (n >= 1000) {
      clearInterval(playTimer);
      playTimer = null;
      document.getElementById('btnPlay').textContent = '▶ Play';
      n = 0;
    }
  }, 100);
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (playTimer) { clearInterval(playTimer); playTimer = null; document.getElementById('btnPlay').textContent = '▶ Play'; }
  if (cells) { uploadGrid(width, height, cells); }
});

// File upload
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadGridBin(new Uint8Array(reader.result));
  reader.readAsArrayBuffer(file);
});

document.getElementById('fileArea').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileArea').addEventListener('dragover', (e) => { e.preventDefault(); });
document.getElementById('fileArea').addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => loadGridBin(new Uint8Array(reader.result));
    reader.readAsArrayBuffer(file);
  }
});

// ---- Init ----
try {
  await initWebGPU();
  statusEl.textContent = 'Ready — click "Load mincpu" to start';
  logMsg('WebGPU 初期化完了', 'ok');
} catch (e) {
  statusEl.textContent = 'Error: ' + e.message;
  logMsg(e.message, 'err');
}
</script>
</body>
</html>
